site_name: COG Patterns
site_url: https://cog.zqmlabs.com/
site_description: Cloud Optimized GeoTIFF (COG) examples for raster creation, validation, cloud-native access, TiTiler serving, and xarray analysis.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/cog-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
